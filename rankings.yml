name: Rankings ValerIA

on:
  schedule:
    # 23:30 UTC de los dias 1 a 3: el cierre de Nueva York del ultimo dia
    # habil del mes ya esta consolidado. Tres intentos por si alguno se salta.
    - cron: "30 23 1-3 * *"
  workflow_dispatch: {}
  # Recalcula y republica al cambiar el universo, el script o la app
  push:
    branches: [main]
    paths: [universos.json, valeria_rankings.py, index.html, manifest.json, .github/workflows/rankings.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rankings
  cancel-in-progress: false

jobs:
  rankings:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy
      - run: python valeria_rankings.py

      - name: Guardar rankings.json en el repositorio
        run: |
          git config user.name "valeria-bot"
          git config user.email "valeria-bot@users.noreply.github.com"
          git add rankings.json
          git diff --cached --quiet || git commit -m "Rankings $(date -u +%Y-%m-%d)"
          git push

      - name: Preparar la web
        run: |
          mkdir _site
          cp index.html rankings.json manifest.json icon-180.png icon-512.png _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
